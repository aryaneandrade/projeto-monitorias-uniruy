server {
    listen 80;
    server_name monitorias.andops.com.br;
    server_tokens off;

    client_max_body_size 20m;

    # Allow Let's Encrypt ACME challenge to validate and renew
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/lib/letsencrypt;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name monitorias.andops.com.br;
    server_tokens off;

    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/monitorias.andops.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitorias.andops.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /static/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_redirect off;
        proxy_pass http://web:8000;
    }

    # health endpoint (optional)
    location = /healthz/ {
        access_log off;
        return 200 'OK';
    }
}
