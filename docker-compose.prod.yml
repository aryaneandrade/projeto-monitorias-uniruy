
services:
  web:
    build: .
    image: monitorias_web:latest
    command: gunicorn app.wsgi:application --bind 0.0.0.0:8000 --workers 4
    env_file: .env
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: monitorias.andops.com.br", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - static_volume:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt
      - ./compose/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  static_volume:

networks: {}
